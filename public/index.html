<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PL-300 Prep</title>
<style>
:root{
  --blue:#0078d4;--blue-d:#106ebe;--blue-l:#eff6fc;--bg:#f3f2f1;--card:#fff;--text:#201f1e;--muted:#605e5c;
  --border:#e1dfdd;--green:#107c10;--green-l:#dff6dd;--red:#a4262c;--red-l:#fde7e9;--amber:#ffb900;--amber-l:#fff4ce;--code:#f3f2f1;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 "Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
code,pre{font-family:Consolas,"Cascadia Mono",Menlo,monospace}
code{background:var(--code);padding:1px 5px;border-radius:3px;font-size:.92em}

/* top bar */
.top{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.top-in{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:22px;min-height:52px;flex-wrap:wrap}
.brand{font-weight:600;white-space:nowrap;color:var(--text)}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;line-height:1.1}
#links{display:flex;gap:4px}
#links a{padding:15px 12px 12px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600}
#links a:hover{color:var(--text);text-decoration:none}
#links a.on{color:var(--blue);border-bottom-color:var(--blue)}
#userbox{margin-left:auto;display:flex;gap:10px;align-items:center}
.uname{font-weight:600}
.badge{background:var(--blue);color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border-radius:10px;letter-spacing:.03em}

.btn{background:var(--blue);color:#fff;border:1px solid var(--blue);padding:8px 18px;border-radius:2px;font-weight:600;display:inline-block}
.btn:hover{background:var(--blue-d);border-color:var(--blue-d);text-decoration:none}
.btn.sec{background:#fff;color:var(--text);border-color:#8a8886}
.btn.sec:hover{background:var(--bg)}
.btn.danger{background:var(--red);border-color:var(--red)}
.btn.sm{padding:4px 12px;font-size:13px}
.btn[disabled],.btn.off{opacity:.45;cursor:not-allowed;pointer-events:none}

.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
h1.pg{font-size:26px;font-weight:600;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--border);padding:22px 26px}
.center{max-width:430px;margin:40px auto}
.center h1{margin:0 0 4px;font-weight:600}
label.f{display:block;font-weight:600;margin:14px 0 4px}
input.t{width:100%;padding:9px 10px;border:1px solid #8a8886;border-radius:2px;background:#fff}
input.t:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
.err{background:var(--red-l);border-left:4px solid var(--red);padding:8px 12px;margin:12px 0;color:var(--red)}
.hint{color:var(--muted);font-size:13px;margin-top:4px}
.alt{margin-top:16px;color:var(--muted)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:18px 0 2px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--border)}
#gbtn{min-height:44px;display:flex;justify-content:center;margin-top:14px}
.spinner{padding:60px;text-align:center;color:var(--muted)}

/* dashboard */
.bar{height:8px;background:var(--border);margin:8px 0}
.bar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.bar.g i{background:var(--green)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin:14px 0 26px}
.pcard{background:#fff;border:1px solid var(--border);padding:16px 18px;display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--blue)}
.pcard.locked{background:#faf9f8;color:var(--muted);border-top-color:#c8c6c4}
.pcard.passed{border-top-color:var(--green)}
.pcard h3{margin:0;font-size:16px;font-weight:600}
.pcard .meta{font-size:13px;color:var(--muted)}
.pcard .acts{margin-top:auto;padding-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:10px;align-self:flex-start;text-transform:uppercase;letter-spacing:.03em}
.chip.ok{background:var(--green-l);color:var(--green)}
.chip.lock{background:#edebe9;color:var(--muted)}
.chip.go{background:var(--blue-l);color:var(--blue-d)}
.chip.try{background:var(--amber-l);color:#8a6100}
h2.sec{font-size:19px;font-weight:600;margin:26px 0 8px}

.tbl{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
.tbl th{background:var(--bg);text-align:left;padding:8px 10px;border:1px solid var(--border);font-weight:600;white-space:nowrap}
.tbl td{padding:8px 10px;border:1px solid var(--border);vertical-align:top}
.tbl.hov tbody tr{cursor:pointer}.tbl.hov tbody tr:hover td{background:var(--blue-l)}
.tw{overflow-x:auto}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:1px 9px;border-radius:10px;color:#fff}
.pill.ok{background:var(--green)}.pill.bad{background:var(--red)}.pill.na{background:#8a8886}

/* study */
.study{display:grid;grid-template-columns:270px 1fr;gap:20px;align-items:start}
.side{background:var(--card);border:1px solid var(--border);position:sticky;top:72px}
.side h3{margin:0;padding:14px 16px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border)}
.side a{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-left:4px solid transparent;border-bottom:1px solid var(--border);color:var(--text)}
.side a:hover{background:var(--bg);text-decoration:none}
.side a.on{background:var(--blue-l);border-left-color:var(--blue);font-weight:600}
.side a.lk{color:var(--muted)}
.side .n{flex:0 0 24px;height:24px;border-radius:50%;background:var(--bg);border:1px solid #c8c6c4;display:grid;place-items:center;font-size:12px;font-weight:600}
.side a.on .n{background:var(--blue);border-color:var(--blue);color:#fff}
.side a.ok .n{background:var(--green);border-color:var(--green);color:#fff}
.screen{background:var(--card);border:1px solid var(--border);padding:28px 32px}
.crumb{color:var(--muted);font-size:13px;margin-bottom:4px}
.screen h1{margin:0 0 6px;font-size:28px;font-weight:600}
.lead{color:var(--muted);font-size:16px;margin:0 0 18px}
.screen h2{font-size:19px;font-weight:600;margin:28px 0 8px;padding-top:6px;border-top:1px solid var(--border)}
.screen h2:first-of-type{border-top:0;margin-top:12px}
.screen h3{font-size:15px;margin:18px 0 6px}
.screen ul{padding-left:22px;margin:6px 0 10px}.screen li{margin:3px 0}
.screen .tbl{margin:10px 0 14px}
.tblw{overflow-x:auto}
pre.code{background:#1f1f1f;color:#e6e6e6;padding:14px 16px;overflow-x:auto;border-radius:2px;font-size:13px;line-height:1.5;margin:10px 0}
pre.code .k{color:#569cd6}pre.code .s{color:#ce9178}pre.code .c{color:#6a9955}
.note{border-left:4px solid var(--blue);background:var(--blue-l);padding:10px 14px;margin:14px 0}
.note.trap{border-color:var(--amber);background:var(--amber-l)}
.note b.t{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.check{list-style:none;padding:0!important}
.check li{padding-left:26px;position:relative}
.check li:before{content:"✓";position:absolute;left:2px;color:var(--green);font-weight:700}
.pager{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:30px;padding-top:18px;border-top:1px solid var(--border);flex-wrap:wrap}
.lockmsg{font-size:13px;color:var(--muted)}

/* exam */
.exam-shell{max-width:980px;margin:0 auto}
.xcard{background:var(--card);border:1px solid var(--border)}
.xhead{background:#323130;color:#fff;display:flex;align-items:center;gap:16px;padding:10px 18px;flex-wrap:wrap}
.xhead .ttl{font-weight:600}
.xhead .sp{margin-left:auto;display:flex;gap:18px;align-items:center}
.timer{font-variant-numeric:tabular-nums;font-weight:600;background:#484644;padding:3px 10px;border-radius:2px}
.timer.low{background:var(--red)}
.xbody{padding:26px 32px;min-height:330px}
.qno{color:var(--muted);font-size:13px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qno .tag{background:var(--blue-l);color:var(--blue-d);padding:1px 8px;border-radius:10px;font-size:12px}
.qtext{font-size:16px;margin-bottom:14px}
.qins{font-weight:600;margin:14px 0 8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);margin:6px 0;cursor:pointer;background:#fff}
.opt:hover{background:var(--bg)}
.opt:has(input:checked){border-color:var(--blue);background:var(--blue-l)}
.opt input{margin-top:4px}
.opt.ok{border-color:var(--green)!important;background:var(--green-l)!important}
.opt.bad{border-color:var(--red)!important;background:var(--red-l)!important}
.opt.dis{cursor:default}
.yn{width:100%;border-collapse:collapse}
.yn th{background:var(--bg);padding:8px 10px;border:1px solid var(--border);text-align:left}
.yn td{padding:8px 10px;border:1px solid var(--border)}
.yn td.c,.yn th.c{text-align:center;width:70px}
.hot{border:1px solid var(--border);background:#faf9f8;padding:16px 18px;line-height:2.4}
select{font:inherit;padding:4px 8px;border:1px solid #8a8886;background:#fff;border-radius:2px;margin:0 3px;max-width:100%}
.ord{list-style:none;padding:0;margin:0}
.ord li{display:flex;align-items:center;gap:10px;border:1px solid var(--border);padding:8px 12px;margin:6px 0;background:#fff}
.ord li .num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.ord li span.tx{flex:1}
.ord li button{border:1px solid #c8c6c4;background:#fff;width:30px;height:28px}
.ord li button:hover:not([disabled]){background:var(--bg)}
.ord li button[disabled]{opacity:.35;cursor:default}
.fb{margin-top:16px;padding:12px 14px;border-left:4px solid}
.fb.ok{background:var(--green-l);border-color:var(--green)}
.fb.bad{background:var(--red-l);border-color:var(--red)}
.xfoot{display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--border);background:#faf9f8;align-items:center;flex-wrap:wrap}
.xfoot .sp{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.flag{display:flex;gap:6px;align-items:center;cursor:pointer;margin-left:auto;font-size:14px;user-select:none}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;margin:12px 0 18px}
.qgrid button{padding:8px 0;border:1px solid #8a8886;background:#fff;position:relative;font-weight:600}
.qgrid button.ans{background:var(--blue);color:#fff;border-color:var(--blue)}
.qgrid button.cur{outline:3px solid var(--amber);outline-offset:1px}
.qgrid button.fl:after{content:"⚑";position:absolute;top:-6px;right:-3px;font-size:13px;color:var(--red)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;border:1px solid #8a8886;vertical-align:-2px;margin-right:5px}
.score{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin:10px 0 18px}
.big{font-size:54px;font-weight:300;line-height:1}
.pb{display:grid;grid-template-columns:260px 1fr 60px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.pb .tr{height:12px;background:var(--border)}.pb .tr i{display:block;height:100%}
details.rv{border:1px solid var(--border);margin:8px 0;background:#fff}
details.rv summary{padding:10px 14px;cursor:pointer;display:flex;gap:10px;align-items:center}
details.rv .in{padding:4px 18px 16px;border-top:1px solid var(--border)}
.st{font-size:12px;font-weight:700;padding:1px 8px;color:#fff;border-radius:10px}
.st.ok{background:var(--green)}.st.bad{background:var(--red)}
.ans-l{margin:6px 0 0;padding-left:20px}
.disc{font-size:12.5px;color:var(--muted);margin-top:16px}

/* admin */
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px}
.subtabs a{padding:10px 16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.subtabs a.on{color:var(--blue);border-bottom-color:var(--blue)}
.subtabs a:hover{text-decoration:none;color:var(--text)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:8px}
.tile{background:#fff;border:1px solid var(--border);padding:14px 16px}
.tile b{display:block;font-size:30px;font-weight:300;line-height:1.1}
.tile span{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.mini{display:inline-block;width:90px;height:8px;background:var(--border);vertical-align:middle;margin-right:6px}
.mini i{display:block;height:100%;background:var(--green)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#323130;color:#fff;padding:10px 18px;z-index:50;max-width:90vw}

@media (max-width:860px){
  .study{grid-template-columns:1fr}
  .side{position:static}
  .screen{padding:20px 16px}
  .xbody{padding:18px 14px}
  .pb{grid-template-columns:1fr 60px}.pb .tr{grid-column:1/-1;order:3}
  .card{padding:18px 16px}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#/dashboard">PL-300 Prep<small>Prepare the data</small></a>
  <nav id="links"></nav>
  <div id="userbox"></div>
</div></header>
<main class="wrap" id="app"><div class="spinner">Loading…</div></main>
<div id="toast" hidden></div>

<script>
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L='ABCDEFGH';
const app=$('#app');
const state={me:null,prog:null};
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}
const fmtDate=ts=>ts?new Date(ts*1000).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
function ago(ts){if(!ts)return 'never';const s=Math.max(0,Math.floor(Date.now()/1000)-ts);
  if(s<90)return 'just now';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';return Math.round(s/86400)+' d ago'}
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');

async function api(path,method='GET',body){
  const opt={method,credentials:'same-origin',headers:{}};
  if(method!=='GET'){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body||{})}
  const r=await fetch('/api'+path,opt);
  let data=null;try{data=await r.json()}catch{}
  if(!r.ok){const e=new Error((data&&data.error)||'Request failed ('+r.status+')');e.status=r.status;throw e}
  return data;
}
function go(h){if(location.hash===h)route();else location.hash=h}
function view(html){app.innerHTML=html;window.scrollTo({top:0})}
const partTitle=(p,n)=>p&&p.exams&&p.exams[n-1]?p.exams[n-1].title:'Part '+n;

function renderHeader(){
  const me=state.me, h=location.hash;
  $('#userbox').innerHTML=me?`<span class="uname">${esc(me.name)}</span>${me.role==='admin'?'<span class="badge">ADMIN</span>':''}<button class="btn sec sm" id="logout">Sign out</button>`:'';
  $('#links').innerHTML=me?`<a href="#/dashboard" class="${/dashboard|part|exam|result/.test(h)?'on':''}">My progress</a>${me.role==='admin'?`<a href="#/admin" class="${/admin/.test(h)?'on':''}">Admin</a>`:''}`:'';
  const lo=$('#logout');if(lo)lo.onclick=async()=>{try{await api('/logout','POST')}catch{}state.me=null;state.prog=null;stopTimer();E=null;renderHeader();go('#/login')};
}

/* ================= auth ================= */
function viewAuth(mode){
  const reg=mode==='register';
  view(`<div class="card center"><h1>${reg?'Create your account':'Sign in'}</h1>
    <p class="sub">${reg?'Register to save your progress and unlock each part as you pass it.':'Welcome back. Continue where you stopped.'}</p>
    ${state.gid?`<div id="gbtn"></div><div class="or">or continue with your email</div>`:''}
    <form id="af" novalidate>
      ${reg?`<label class="f" for="nm">Full name</label><input class="t" id="nm" autocomplete="name" maxlength="80" required>`:''}
      <label class="f" for="em">Email</label><input class="t" id="em" type="email" autocomplete="email" maxlength="120" required>
      <label class="f" for="pw">Password</label><input class="t" id="pw" type="password" autocomplete="${reg?'new-password':'current-password'}" maxlength="200" required>
      ${reg?'<div class="hint">At least 8 characters.</div>':''}
      <div class="err" id="ae" hidden></div>
      <p><button class="btn" id="asub" style="width:100%">${reg?'Create account':'Sign in'}</button></p>
    </form>
    <div class="alt">${reg?'Already registered? <a href="#/login">Sign in</a>':'New here? <a href="#/register">Create an account</a>'}</div></div>`);
  $('#af').onsubmit=async e=>{
    e.preventDefault();const b=$('#asub'),er=$('#ae');er.hidden=true;b.disabled=true;
    try{
      const body={email:$('#em').value,password:$('#pw').value};if(reg)body.name=$('#nm').value;
      const r=await api(reg?'/register':'/login','POST',body);
      state.me=r.user;renderHeader();go('#/dashboard');
    }catch(x){er.textContent=x.message;er.hidden=false;b.disabled=false}
  };
  (reg?$('#nm'):$('#em')).focus();
  mountGoogle(reg);
}
function loadGsi(){return new Promise((res,rej)=>{
  if(window.google&&google.accounts&&google.accounts.id)return res();
  const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function mountGoogle(reg){
  const box=$('#gbtn');if(!state.gid||!box)return;
  try{
    await loadGsi();
    google.accounts.id.initialize({client_id:state.gid,ux_mode:'popup',callback:async r=>{
      const er=$('#ae');
      try{const u=await api('/google','POST',{credential:r.credential});state.me=u.user;renderHeader();go('#/dashboard')}
      catch(x){if(er){er.textContent=x.message;er.hidden=false}else toast(x.message)}
    }});
    google.accounts.id.renderButton(box,{theme:'outline',size:'large',shape:'rectangular',text:reg?'signup_with':'signin_with',width:Math.min(340,box.clientWidth||340)});
  }catch{box.innerHTML='<div class="hint">Google sign-in is unavailable right now. Use your email instead.</div>'}
}

/* ================= dashboard ================= */
function chip(x){
  if(!x.unlocked)return '<span class="chip lock">🔒 Locked</span>';
  if(x.passed)return '<span class="chip ok">Passed ✓</span>';
  if(x.attempts>0)return '<span class="chip try">In progress</span>';
  return '<span class="chip go">Ready</span>';
}
async function viewDashboard(){
  view('<div class="spinner">Loading…</div>');
  const p=await api('/progress');state.prog=p;
  const parts=p.exams.slice(0,6), fin=p.exams[6];
  const passed=parts.filter(x=>x.passed).length;
  const card=x=>{
    const n=x.exam, fi=n===7;
    const lockTxt=fi?'Pass all six part exams to unlock.':`Pass the Part ${n-1} exam (${p.passPct}%) to unlock.`;
    return `<div class="pcard ${x.unlocked?'':'locked'} ${x.passed?'passed':''}">
      <div class="row sp"><span class="meta">${fi?'FINAL':'PART '+n}</span>${chip(x)}</div>
      <h3>${esc(x.title)}</h3>
      <div class="meta">${x.questions} questions${x.attempts?` · best ${x.best}% · ${x.attempts} attempt${x.attempts>1?'s':''}`:''}</div>
      ${x.unlocked?'':`<div class="meta">${lockTxt}</div>`}
      ${x.overridden?'<div class="meta">Unlocked by an admin.</div>':''}
      <div class="acts">${fi?'':`<a class="btn sec sm ${x.unlocked?'':'off'}" href="#/part/${n}">Study</a>`}
        <a class="btn sm ${x.unlocked?'':'off'}" href="#/exam/${n}">${x.passed?'Retake exam':'Take exam'}</a></div></div>`;
  };
  view(`<h1 class="pg">Hi ${esc(state.me.name.split(' ')[0])} 👋</h1>
    <p class="sub">Study each part, then pass its exam (${p.passPct}% or more) to unlock the next one.</p>
    <div class="card"><div class="row sp"><b>Overall progress</b><span>${passed} of 6 parts passed${fin.passed?' · Final exam passed 🎉':''}</span></div>
      <div class="bar ${passed===6?'g':''}"><i style="width:${passed/6*100}%"></i></div></div>
    <h2 class="sec">Parts</h2><div class="cards">${parts.map(card).join('')}</div>
    <h2 class="sec">Final exam</h2><div class="cards">${card(fin)}</div>

      ${p.history.map(h=>`<tr data-href="#/result/${h.id}"><td>${fmtDate(h.submitted_at)}</td><td>${h.exam===7?'Final exam':'Part '+h.exam+' – '+esc(partTitle(p,h.exam))}</td><td>${h.correct}/${h.total} (${h.pct}%)</td><td><span class="pill ${h.passed?'ok':'bad'}">${h.passed?'Passed':'Not passed'}</span></td></tr>`).join('')}

/* ================= exam runner ================= */
let E=null,timer=null;
function stopTimer(){clearInterval(timer);timer=null}
const dKey=id=>'pl300.draft.'+id;
function saveDraft(){if(!E)return;try{localStorage.setItem(dKey(E.attemptId),JSON.stringify({ans:E.ans,flag:[...E.flag],touched:[...E.touched],idx:E.idx}))}catch{}}
function loadDraft(id){try{return JSON.parse(localStorage.getItem(dKey(id)))}catch{return null}}
function clearDraft(id){try{localStorage.removeItem(dKey(id))}catch{}}

async function viewExamLobby(n){
  if(!(n>=1&&n<=7))return go('#/dashboard');
  view('<div class="spinner">Loading…</div>');
  const p=await api('/progress');state.prog=p;const x=p.exams[n-1],fin=n===7;
  if(!x.unlocked){
    return view(`<div class="card center" style="max-width:560px"><h1>🔒 Locked</h1><p class="sub">${fin?'Pass all six part exams to unlock the final exam.':`Pass the Part ${n-1} exam (${p.passPct}%) to unlock Part ${n}.`}</p><a class="btn" href="#/dashboard">Back to my progress</a></div>`);
  }
  view(`<div class="exam-shell"><div class="xcard"><div class="xhead"><span class="ttl">${fin?'Final practice exam':`Part ${n} exam`}</span><span class="sp">${esc(fin?'All parts':x.title)}</span></div>
    <div class="xbody"><h1 style="margin:0 0 8px;font-weight:600">Instructions</h1>
    <p>This exam has <b>${x.questions} questions</b> in the style of the PL-300 exam (single choice, multiple choice, Yes/No, drop-down and ordering).</p>
    <ul><li>Pass mark: <b>${p.passPct}%</b>${fin?'':` — passing unlocks ${n<6?`Part ${n+1}`:'the final exam'}.`}</li>
      <li>A question counts only if <b>all</b> of its parts are correct.</li>
      <li>You can mark questions for review and use the question list at any time.</li>
      <li>${fin?'You have <b>45 minutes</b>. The timer keeps running if you leave the page.':'No time limit. Correct answers and explanations appear after you submit.'}</li>
      <li>You can retake the exam as many times as you need.</li></ul>
    <p class="disc">Unofficial study material, not affiliated with or endorsed by Microsoft. Questions are original practice items.</p></div>
    <div class="xfoot"><a class="btn sec" href="#/dashboard">Cancel</a><div class="sp"><button class="btn" id="start">Start exam</button></div></div></div></div>`);
  $('#start').onclick=async e=>{
    e.target.disabled=true;
    try{
      const r=await api(`/exams/${n}/start`,'POST');
      E={attemptId:r.attemptId,exam:n,qs:r.questions,idx:0,ans:{},flag:new Set(),touched:new Set(),screen:'q',
         limit:r.limitSeconds,deadline:r.remainingSeconds!=null?Date.now()+r.remainingSeconds*1000:null,passPct:r.passPct,busy:false};
      r.questions.filter(q=>q.type==='order').forEach(q=>E.ans[q.id]=q.order.map(o=>o.k));
      const d=loadDraft(r.attemptId);
      if(d){Object.assign(E.ans,d.ans||{});E.flag=new Set(d.flag||[]);E.touched=new Set(d.touched||[]);E.idx=Math.min(d.idx||0,r.questions.length-1)}
      if(E.deadline){timer=setInterval(tick,1000)}
      xRender();
    }catch(x){toast(x.message);e.target.disabled=false}
  };
}
function tick(){
  if(!E||!E.deadline)return;
  const r=Math.max(0,Math.round((E.deadline-Date.now())/1000));
  const t=$('#timer');if(t){t.textContent=mmss(r);t.classList.toggle('low',r<300)}
  if(r<=0){stopTimer();toast('Time is up – submitting your answers.');submitExam(true)}
}
function answered(q){
  const a=E.ans[q.id];
  switch(q.type){
    case'single':return a!=null;
    case'multi':return Array.isArray(a)&&a.length>0;
    case'yesno':return Array.isArray(a)&&a.length===q.st.length&&a.every(v=>v!=null);
    case'dropdown':return Array.isArray(a)&&a.length===q.dd.length&&a.every(v=>v!==''&&v!=null);
    case'order':return E.touched.has(q.id);
  }
}
function xRender(){
  if(!E)return;
  if(E.screen==='q')xQuestion();else xReview();
  window.scrollTo({top:0});
}
function xHead(title){
  return `<div class="xhead"><span class="ttl">${title}</span><span class="sp">${E.deadline?`<span class="timer" id="timer">${mmss(Math.max(0,Math.round((E.deadline-Date.now())/1000)))}</span>`:''}${E.screen==='q'?`<span>Question ${E.idx+1} of ${E.qs.length}</span>`:''}</span></div>`;
}
function xQuestion(){
  const q=E.qs[E.idx],n=E.qs.length,a=E.ans[q.id];let body='';
  if(q.type==='single'){
    body=`<div class="qtext">${q.text}</div><div class="qins">Select one answer.</div>`+q.opts.map((o,i)=>
      `<label class="opt"><input type="radio" name="o" value="${i}" ${a===i?'checked':''}><span><b>${L[i]}.</b> ${o}</span></label>`).join('');
  }else if(q.type==='multi'){
    body=`<div class="qtext">${q.text}</div><div class="qins">${q.ins||''} <span style="font-weight:400;color:var(--muted)">(Select ${q.pick}.)</span></div>`+q.opts.map((o,i)=>
      `<label class="opt"><input type="checkbox" name="o" value="${i}" ${Array.isArray(a)&&a.includes(i)?'checked':''}><span><b>${L[i]}.</b> ${o}</span></label>`).join('');
  }else if(q.type==='yesno'){
    body=`<div class="qtext">${q.text}</div><table class="yn"><tr><th>Statements</th><th class="c">Yes</th><th class="c">No</th></tr>`+q.st.map((s,i)=>{
      const v=Array.isArray(a)?a[i]:null;
      return `<tr><td>${s}</td><td class="c"><input type="radio" name="s${i}" data-s="${i}" value="1" ${v===true?'checked':''}></td><td class="c"><input type="radio" name="s${i}" data-s="${i}" value="0" ${v===false?'checked':''}></td></tr>`}).join('')+'</table>';
  }else if(q.type==='dropdown'){
    const html=q.tpl.replace(/\{(\d)\}/g,(m,i)=>{i=+i;const v=Array.isArray(a)?a[i]:'';
      return `<select data-d="${i}"><option value="">Select…</option>${q.dd[i].opts.map((o,k)=>`<option value="${k}" ${v!==''&&v!=null&&+v===k?'selected':''}>${esc(o)}</option>`).join('')}</select>`});
    body=`<div class="qtext">${q.text}</div><div class="hot">${html}</div>`;
  }else if(q.type==='order'){
    const text=Object.fromEntries(q.order.map(o=>[o.k,o.t]));
    body=`<div class="qtext">${q.text}</div><div class="qins">${q.ins||''} <span style="font-weight:400;color:var(--muted)">(Use the arrows to move a step.)</span></div>
      <ol class="ord">${a.map((k,pos)=>`<li><span class="num">${pos+1}</span><span class="tx">${text[k]}</span>
      <button data-mv="${pos}" data-dir="-1" ${pos===0?'disabled':''} aria-label="Move up">▲</button><button data-mv="${pos}" data-dir="1" ${pos===a.length-1?'disabled':''} aria-label="Move down">▼</button></li>`).join('')}</ol>`;
  }
  app.innerHTML=`<div class="exam-shell"><div class="xcard">${xHead(E.exam===7?'Final practice exam':`Part ${E.exam} exam`)}
    <div class="xbody"><div class="qno"><span class="tag">Part ${q.part}</span>
      <label class="flag"><input type="checkbox" id="flag" ${E.flag.has(q.id)?'checked':''}> Mark for review</label></div>${body}</div>
    <div class="xfoot"><button class="btn sec" id="prev" ${E.idx===0?'disabled':''}>◀ Previous</button>
      <button class="btn sec" id="next">${E.idx===n-1?'Review ▶':'Next ▶'}</button>
      <div class="sp"><button class="btn sec" id="list">Question list</button><button class="btn danger" id="end">End exam</button></div></div></div></div>`;
}
function xReview(){
  const n=E.qs.length,un=E.qs.filter(q=>!answered(q)).length;
  app.innerHTML=`<div class="exam-shell"><div class="xcard">${xHead('Review screen')}
    <div class="xbody"><h2 style="margin:0 0 8px;font-weight:600">Review your answers</h2>
    <p>Answered: <b>${n-un}</b> of ${n} · Unanswered: <b>${un}</b> · Marked for review: <b>${E.flag.size}</b></p>
    <div class="qgrid">${E.qs.map((q,i)=>`<button data-q="${i}" class="${answered(q)?'ans':''} ${E.flag.has(q.id)?'fl':''} ${i===E.idx?'cur':''}">${i+1}</button>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--blue);border-color:var(--blue)"></i>Answered</span><span><i></i>Not answered</span><span><span style="color:var(--red)">⚑</span> Marked for review</span></div></div>
    <div class="xfoot"><button class="btn sec" id="back">◀ Back to questions</button><div class="sp"><button class="btn danger" id="end">End exam</button></div></div></div></div>`;
}
async function submitExam(force){
  if(!E||E.busy)return;
  const un=E.qs.filter(q=>!answered(q)).length;
  if(!force&&!confirm((un?`You have ${un} unanswered question${un>1?'s':''}. `:'')+'Submit the exam now and see your results?'))return;
  E.busy=true;stopTimer();
  const answers={};E.qs.forEach(q=>{if(answered(q))answers[q.id]=E.ans[q.id]});
  try{
    const res=await api(`/attempts/${E.attemptId}/submit`,'POST',{answers});
    clearDraft(E.attemptId);E=null;
    state.prog={...(state.prog||{}),exams:res.progress};
    renderResult(res,true);
  }catch(x){
    if(x.status===401){state.me=null;renderHeader();return viewAuth('login')}
    toast(x.message);if(E)E.busy=false;
  }
}
app.addEventListener('change',e=>{
  if(!E||E.screen!=='q')return;
  const q=E.qs[E.idx],t=e.target;
  if(t.id==='flag'){t.checked?E.flag.add(q.id):E.flag.delete(q.id);saveDraft();return}
  if(q.type==='single'&&t.name==='o')E.ans[q.id]=+t.value;
  else if(q.type==='multi'&&t.name==='o'){
    const c=new Set(E.ans[q.id]||[]);
    if(t.checked){if(c.size>=q.pick){t.checked=false;return}c.add(+t.value)}else c.delete(+t.value);
    E.ans[q.id]=[...c];
  }else if(q.type==='yesno'&&t.dataset.s!=null){
    const a=E.ans[q.id]||q.st.map(()=>null);a[+t.dataset.s]=t.value==='1';E.ans[q.id]=a;
  }else if(q.type==='dropdown'&&t.dataset.d!=null){
    const a=E.ans[q.id]||q.dd.map(()=>'');a[+t.dataset.d]=t.value===''?'':+t.value;E.ans[q.id]=a;
  }
  saveDraft();
});
app.addEventListener('click',e=>{
  const tr=e.target.closest('tr[data-href]');if(tr){go(tr.dataset.href);return}
  const t=e.target.closest('button');if(!t||!E)return;
  const q=E.qs[E.idx];
  if(E.screen==='q'){
    if(t.id==='prev'){E.idx--;saveDraft();xRender()}
    else if(t.id==='next'){if(E.idx===E.qs.length-1)E.screen='review';else E.idx++;saveDraft();xRender()}
    else if(t.id==='list'){E.screen='review';xRender()}
    else if(t.id==='end'){submitExam(false)}
    else if(t.dataset.mv!=null){const p=+t.dataset.mv,d=+t.dataset.dir,a=E.ans[q.id];[a[p],a[p+d]]=[a[p+d],a[p]];E.touched.add(q.id);saveDraft();xQuestion()}
  }else if(E.screen==='review'){
    if(t.dataset.q!=null){E.idx=+t.dataset.q;E.screen='q';xRender()}
    else if(t.id==='back'){E.screen='q';xRender()}
    else if(t.id==='end'){submitExam(false)}
  }
});

/* ================= results ================= */
function fmtAns(q,a){
  if(a==null)return '<i>Not answered</i>';
  if(q.type==='single')return `<b>${L[a]}.</b> ${q.opts[a]}`;
  if(q.type==='multi')return `<ul class="ans-l">${[...a].sort().map(i=>`<li><b>${L[i]}.</b> ${q.opts[i]}</li>`).join('')}</ul>`;
  if(q.type==='yesno')return `<ul class="ans-l">${q.st.map((s,i)=>`<li>${s} — <b>${a[i]==null?'—':a[i]?'Yes':'No'}</b></li>`).join('')}</ul>`;
  if(q.type==='dropdown')return q.tpl.replace(/\{(\d)\}/g,(m,i)=>a[+i]===''||a[+i]==null?'<b>—</b>':`<b>${esc(q.dd[+i].opts[a[+i]])}</b>`);
  if(q.type==='order')return `<ol class="ans-l">${a.map(k=>`<li>${q.items[k]}</li>`).join('')}</ol>`;
}
const correctOf=q=>q.type==='single'||q.type==='multi'||q.type==='yesno'?q.ans:q.type==='dropdown'?q.dd.map(d=>d.ans):q.items.map((_,i)=>i);

function renderResult(r,justSubmitted){
  const fin=r.exam===7, expired=r.status==='expired';
  const parts=[...new Set(r.questions.map(q=>q.part))];
  const bars=fin?parts.map(p=>{const qs=r.questions.filter(q=>q.part===p),c=qs.filter(q=>q.ok).length,pp=Math.round(c/qs.length*100);
    return `<div class="pb"><span>Part ${p}: ${esc(partTitle(state.prog,p))}</span><div class="tr"><i style="width:${pp}%;background:${pp>=r.passPct?'var(--green)':'var(--red)'}"></i></div><b>${c}/${qs.length}</b></div>`}).join(''):'';
  let cta='';
  if(r.passed&&!fin)cta=r.exam<6?`<a class="btn" href="#/part/${r.exam+1}">Continue to Part ${r.exam+1} →</a>`:'<a class="btn" href="#/exam/7">Take the final exam →</a>';
  else if(r.passed&&fin)cta='<span>🎉 You completed the whole programme.</span>';
  else if(!expired)cta=`${fin?'':`<a class="btn" href="#/part/${r.exam}">Review Part ${r.exam}</a>`}<a class="btn sec" href="#/exam/${r.exam}">Retake exam</a>`;
  else cta=`<a class="btn sec" href="#/exam/${r.exam}">Start a new attempt</a>`;
  view(`<div class="exam-shell"><div class="xcard"><div class="xhead"><span class="ttl">${fin?'Final practice exam':`Part ${r.exam} exam`} · Results</span><span class="sp">${fmtDate(r.submittedAt)}</span></div>
    <div class="xbody">
      ${expired?'<div class="err">Time expired before you submitted, so this attempt scored 0.</div>':''}
      <div class="score"><div class="big">${r.pct}%</div><div><span class="pill ${r.passed?'ok':'bad'}" style="font-size:14px;padding:4px 14px">${r.passed?'PASS':'NOT YET'}</span>
        <p style="margin:8px 0 0">${r.correct} of ${r.total} questions correct · pass mark ${r.passPct}%</p></div></div>
      ${r.passed&&!fin&&justSubmitted?`<div class="fb ok"><b>${r.exam<6?`Part ${r.exam+1} is now unlocked.`:'The final exam is now unlocked.'}</b></div>`:''}
      ${!r.passed&&!expired?`<div class="fb bad"><b>You need ${r.passPct}% to continue.</b> Review the questions below, re-read the study material, and try again.</div>`:''}
      ${bars?`<h3>Performance by part</h3>${bars}`:''}
      <div class="row" style="margin:18px 0">${cta}<a class="btn sec" href="#/dashboard">My progress</a></div>
      <h3 style="margin-top:22px">Question review</h3>
      ${r.questions.map((q,i)=>`<details class="rv" ${q.ok?'':'open'}><summary><span class="st ${q.ok?'ok':'bad'}">${q.ok?'Correct':q.userAnswer==null?'Unanswered':'Incorrect'}</span><span>Question ${i+1} · Part ${q.part}</span></summary>
        <div class="in"><div class="qtext" style="margin-top:12px">${q.text}</div>${q.ins?`<p><b>${q.ins}</b></p>`:''}
        <p style="margin-bottom:2px"><b>Your answer:</b></p>${fmtAns(q,q.userAnswer)}
        ${q.ok?'':`<p style="margin:12px 0 2px"><b>Correct answer:</b></p>${fmtAns(q,correctOf(q))}`}
        <div class="fb ${q.ok?'ok':'bad'}"><b>Explanation.</b> ${q.exp}</div></div></details>`).join('')}
    </div></div></div>`);
}
async function viewResult(id){
  view('<div class="spinner">Loading…</div>');
  if(!state.prog)state.prog=await api('/progress');
  renderResult(await api('/attempts/'+id),false);
}

      $('#ulist').innerHTML=f.length?`<table class="tbl hov"><thead><tr><th>Name</th><th>Role</th><th>Parts passed</th><th>Attempts</th><th>Last activity</th><th>Joined</th></tr></thead><tbody>
        ${f.map(u=>`<tr data-href="#/admin/user/${u.id}"><td><b>${esc(u.name)}</b><div class="hint">${esc(u.email)}</div></td><td>${u.role==='admin'?'<span class="badge">ADMIN</span>':'User'}</td>
        <td><span class="mini"><i style="width:${u.parts_passed/6*100}%"></i></span>${u.parts_passed}/6${u.final_passed?' 🏁':''}</td><td>${u.attempts}</td><td>${ago(u.last_attempt||u.last_seen)}</td><td>${fmtDate(u.created_at).split(',')[0]}</td></tr>`).join('')}</tbody></table>`:'<p class="sub">No users match.</p>';
    };
    view(adminTabs('users')+`<div class="tools"><input class="t" id="usearch" placeholder="Search by name or email…" style="max-width:340px"><span class="hint" style="align-self:center">${users.length} user${users.length===1?'':'s'}</span></div><div class="tw" id="ulist"></div>`);
    draw('');$('#usearch').oninput=e=>draw(e.target.value.trim());
  }
}
async function viewAdminUser(id){
  view(adminTabs('user')+'<div class="spinner">Loading…</div>');
  if(!state.prog)state.prog=await api('/progress');
  const d=await api('/admin/users/'+id),u=d.user,self=u.id===state.me.id;
  const act=async(path,body,msg)=>{try{await api(`/admin/users/${id}/${path}`,'POST',body);toast(msg);await viewAdminUser(id)}catch(x){toast(x.message)}};
  view(adminTabs('user')+`<p><a href="#/admin/users">← All users</a></p>
    <div class="card"><div class="row sp"><div><h2 style="margin:0">${esc(u.name)} ${u.role==='admin'?'<span class="badge">ADMIN</span>':''}</h2>
      <div class="sub" style="margin:2px 0 0">${esc(u.email)} · joined ${fmtDate(u.created_at)} · last seen ${ago(u.last_seen)}</div></div>
      <div class="row">${self?'<span class="hint">This is you.</span>':`
        <button class="btn sec sm" id="a-role">${u.role==='admin'?'Remove admin':'Make admin'}</button>
        <button class="btn sec sm" id="a-pw">Set password</button>
        <button class="btn sec sm" id="a-reset">Reset progress</button>
        <button class="btn danger sm" id="a-del">Delete user</button>`}</div></div></div>
    <h2 class="sec">Progress</h2><div class="tw"><table class="tbl"><thead><tr><th>Exam</th><th>Status</th><th>Best</th><th>Attempts</th><th>Last attempt</th><th>Access</th></tr></thead><tbody>
    ${d.exams.map(x=>`<tr><td>${x.exam===7?'Final exam':`Part ${x.exam} – ${esc(x.title)}`}</td>
      <td>${x.passed?'<span class="pill ok">Passed</span>':x.unlocked?'<span class="pill na">Open</span>':'<span class="pill bad">Locked</span>'}</td>
      <td>${x.best==null?'—':x.best+'%'}</td><td>${x.attempts}</td><td>${ago(x.last)}</td>
      <td>${x.exam===1?'<span class="hint">Always open</span>':x.overridden?`<button class="btn sec sm" data-un="${x.exam}" data-v="0">Remove unlock</button>`:x.unlocked?'<span class="hint">Earned</span>':`<button class="btn sm" data-un="${x.exam}" data-v="1">Unlock</button>`}</td></tr>`).join('')}</tbody></table></div>
    <h2 class="sec">Attempts</h2>
    ${d.attempts.length?`<div class="tw"><table class="tbl hov"><thead><tr><th>Date</th><th>Exam</th><th>Score</th><th>Result</th></tr></thead><tbody>
      ${d.attempts.map(a=>`<tr data-href="#/result/${a.id}"><td>${fmtDate(a.submitted_at||a.started_at)}</td><td>${a.exam===7?'Final exam':'Part '+a.exam}</td><td>${a.status==='expired'?'Expired':`${a.correct}/${a.total} (${a.pct}%)`}</td><td><span class="pill ${a.passed?'ok':'bad'}">${a.passed?'Passed':'Not passed'}</span></td></tr>`).join('')}</tbody></table></div>`:'<p class="sub">No attempts yet.</p>'}`);
  $$('[data-un]').forEach(b=>b.onclick=()=>act('unlock',{exam:+b.dataset.un,unlock:b.dataset.v==='1'},b.dataset.v==='1'?'Unlocked.':'Override removed.'));
  if(!self){
    $('#a-role').onclick=()=>{if(confirm(u.role==='admin'?`Remove admin rights from ${u.name}?`:`Make ${u.name} an admin? They will see all user data.`))act('role',{role:u.role==='admin'?'user':'admin'},'Role updated.')};
    $('#a-pw').onclick=()=>{const p=prompt(`New password for ${u.email} (min. 8 characters). They will be signed out everywhere.`);if(p)act('password',{password:p},'Password updated.')};
    $('#a-reset').onclick=()=>{if(confirm(`Delete ALL attempts and unlocks for ${u.name}? This cannot be undone.`))act('reset-progress',{},'Progress reset.')};
    $('#a-del').onclick=async()=>{if(confirm(`Permanently delete ${u.name} (${u.email}) and all their data?`)){try{await api(`/admin/users/${id}/delete`,'POST');toast('User deleted.');go('#/admin/users')}catch(x){toast(x.message)}}};
  }
}

/* ================= router ================= */
async function route(){
  stopTimer();
  const parts=(location.hash.replace(/^#\/?/,'')||'').split('/'),a=parts[0],b=parts[1];
  if(E&&a!=='exam'){/* leaving an exam page: attempt stays open on the server and resumes later */E=null}
  renderHeader();
  if(!state.me){a==='register'?viewAuth('register'):viewAuth('login');return}
  if(!a||a==='login'||a==='register'){location.replace('#/dashboard');return}
  try{
    if(a==='dashboard')await viewDashboard();
    else if(a==='part')await viewPart(+b||1);
    else if(a==='exam'){if(E&&E.exam===+b){if(E.deadline)timer=setInterval(tick,1000);xRender()}else await viewExamLobby(+b)}
    else if(a==='result')await viewResult(+b);
    else if(a==='admin'){
      if(state.me.role!=='admin')return go('#/dashboard');
      if(b==='user')await viewAdminUser(+parts[2]);else await viewAdmin(b);
    }else location.replace('#/dashboard');
  }catch(e){
    if(e.status===401){state.me=null;renderHeader();viewAuth('login');return}
    view(`<div class="card center" style="max-width:560px"><h1>Hmm…</h1><div class="err">${esc(e.message)}</div><a class="btn" href="#/dashboard">Back to my progress</a></div>`);
  }
  renderHeader();
}
window.addEventListener('hashchange',route);
window.addEventListener('beforeunload',e=>{if(E&&E.screen){saveDraft()}});
(async()=>{
  try{const m=await api('/me');state.me=m.user;state.gid=m.googleClientId||null}catch{state.me=null}
  route();
})();
</script>
